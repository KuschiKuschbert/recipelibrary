name: Riviera standards audit

on:
  push:
    branches: [ main ]
    paths:
      - 'riviera_data/**'
      - 'scripts/audit_riviera_recipe_standards.py'
      - '.github/workflows/riviera-standards-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Riviera standards audit
        run: |
          mkdir -p docs/audit
          python3 scripts/audit_riviera_recipe_standards.py | tee docs/audit/riviera_recipe_standards_audit_latest.txt
          python3 scripts/audit_riviera_recipe_standards.py --strict > docs/audit/riviera_recipe_standards_audit_strict_latest.txt || true

      - name: Commit audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/riviera_recipe_standards_audit_latest.txt docs/audit/riviera_recipe_standards_audit_strict_latest.txt
          if git diff --cached --quiet; then
            echo "No audit output changes to commit."
          else
            git commit -m "Update Riviera standards audit output"
            git push
          fi
