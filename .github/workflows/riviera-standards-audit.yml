# Manual trigger touch: 2026-06-04
name: Riviera standards audit

on:
  push:
    branches: [ main ]
    paths:
      - 'riviera_data/**'
      - 'riviera.html'
      - 'assets/screen-wake.js'
      - 'assets/riviera-service-variants.js'
      - 'assets/planner-scale.js'
      - 'assets/package-planner.js'
      - 'assets/package-prep-sheet.js'
      - 'assets/order-list.js'
      - 'scripts/audit_riviera_recipe_standards.py'
      - 'scripts/static_smoke.py'
      - 'scripts/audit_riviera_frontend_service_variants.py'
      - 'scripts/audit_riviera_source_alignment.py'
      - 'scripts/audit_riviera_service_variant_display_samples.py'
      - 'scripts/validate_riviera_release_policy.py'
      - 'scripts/sync_riviera_package_policy.py'
      - '.github/workflows/riviera-standards-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Riviera standards audit
        run: |
          mkdir -p docs/audit
          python3 scripts/audit_riviera_recipe_standards.py | tee docs/audit/riviera_recipe_standards_audit_latest.txt
          python3 scripts/audit_riviera_recipe_standards.py --strict | tee docs/audit/riviera_recipe_standards_audit_strict_latest.txt
          python3 scripts/audit_riviera_recipe_standards.py --strict --all-builtins | tee docs/audit/riviera_recipe_standards_audit_strict_all_builtins_latest.txt
          python3 scripts/audit_riviera_frontend_service_variants.py | tee docs/audit/riviera_frontend_service_variants_audit_latest.txt
          python3 scripts/audit_riviera_source_alignment.py | tee docs/audit/riviera_source_alignment_audit_latest.txt
          python3 scripts/audit_riviera_service_variant_display_samples.py | tee docs/audit/riviera_service_variant_display_samples_audit_latest.txt
          python3 scripts/sync_riviera_package_policy.py --check
          python3 scripts/validate_riviera_release_policy.py
          python3 scripts/static_smoke.py

      - name: Commit audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/riviera_recipe_standards_audit_latest.txt docs/audit/riviera_recipe_standards_audit_strict_latest.txt docs/audit/riviera_recipe_standards_audit_strict_all_builtins_latest.txt docs/audit/riviera_frontend_service_variants_audit_latest.txt docs/audit/riviera_source_alignment_audit_latest.txt docs/audit/riviera_service_variant_display_samples_audit_latest.txt
          if git diff --cached --quiet; then
            echo "No audit output changes to commit."
          else
            git commit -m "Update Riviera standards audit output"
            git push
          fi
