name: Riviera sync integrity

on:
  push:
    branches: [main]
    paths:
      - "riviera_sources/**"
      - "riviera_data/**"
      - "output/pdf/Riviera_Kitchen_Recipe_Card_Book_2026-07-08.pdf"
      - "scripts/build_riviera_source_of_truth.py"
      - "scripts/sync_riviera_recipe_catalog.py"
      - "scripts/riviera_sync.py"
      - "scripts/validate_riviera_builtins.py"
      - "scripts/audit_riviera_source_alignment.py"
      - "scripts/audit_riviera_recipe_standards.py"
      - "docs/riviera/RIVIERA_SYNC_RUNBOOK.md"
      - "AGENTS.md"
      - ".github/workflows/riviera-sync.yml"
  pull_request:
    branches: [main]
    paths:
      - "riviera_sources/**"
      - "riviera_data/**"
      - "output/pdf/Riviera_Kitchen_Recipe_Card_Book_2026-07-08.pdf"
      - "scripts/build_riviera_source_of_truth.py"
      - "scripts/sync_riviera_recipe_catalog.py"
      - "scripts/riviera_sync.py"
      - "scripts/validate_riviera_builtins.py"
      - "scripts/audit_riviera_source_alignment.py"
      - "scripts/audit_riviera_recipe_standards.py"
      - "docs/riviera/RIVIERA_SYNC_RUNBOOK.md"
      - "AGENTS.md"
      - ".github/workflows/riviera-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Riviera synchronization chain
        run: python3 scripts/riviera_sync.py verify --ci
