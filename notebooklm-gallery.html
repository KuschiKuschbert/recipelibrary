<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c">
<meta name="description" content="NotebookLM and other visual summaries for the Kuschi kitchen reference set.">
<title>Visual guides · Kuschi Kitchen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c9a96e'/%3E%3C/svg%3E" />
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css?v=47">
<style>
  :root { --app-header-h: 65px; }
  body.nb-page {
    font-family: Inter, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100dvh;
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  .nb-shell {
    max-width: 1100px;
    margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top, 0px)) 24px 80px;
  }
  .nb-nav {
    font-size: 13px;
    font-weight: 500;
    color: var(--text3);
    margin-bottom: 20px;
  }
  .nb-nav a { color: var(--text3); text-decoration: none; }
  .nb-nav a:hover { color: var(--gold); }
  .nb-hero-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .nb-hero-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 700;
    margin: 0 0 10px;
    line-height: 1.15;
  }
  .nb-hero-sub {
    font-size: 15px;
    color: var(--text2);
    line-height: 1.55;
    max-width: 640px;
    margin: 0 0 24px;
  }
  .nb-status {
    font-size: 13px;
    color: var(--text3);
    margin-bottom: 16px;
  }
  .nb-filters {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    margin-bottom: 20px;
    font-size: 13px;
  }
  .nb-filters:empty {
    display: none;
  }
  .nb-chip-label { color: var(--text3); }
  .nb-chip {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    text-decoration: none;
    font-weight: 500;
  }
  .nb-chip:hover { border-color: var(--gold); color: var(--gold-light); }
  .nb-chip--on {
    border-color: var(--gold);
    color: var(--gold);
    background: var(--gold-dim);
  }
  .nb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    gap: 20px;
  }
  .nb-card {
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .nb-card-hit {
    display: block;
    width: 100%;
    padding: 0;
    margin: 0;
    border: none;
    background: var(--bg2);
    cursor: zoom-in;
    line-height: 0;
  }
  .nb-thumb {
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    display: block;
  }
  .nb-card-body { padding: 14px 16px 16px; }
  .nb-card-title {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    margin: 0 0 6px;
    font-weight: 600;
  }
  .nb-card-blurb {
    font-size: 13px;
    color: var(--text2);
    margin: 0;
    line-height: 1.45;
  }
  .nb-card-src {
    font-size: 11px;
    color: var(--text3);
    margin: 8px 0 0;
  }
  .nb-empty {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 28px 20px;
    text-align: center;
    color: var(--text2);
    font-size: 14px;
    line-height: 1.6;
  }
  .nb-empty a { color: var(--gold); }
  .nb-empty code { font-size: 12px; color: var(--text3); }
  .modal-overlay#nbModal {
    z-index: 1100;
    padding: 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
    align-items: center;
    justify-content: center;
  }
  .modal-overlay#nbModal .modal {
    max-width: min(96vw, 1200px);
    max-height: min(92vh, 900px);
    width: 100%;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: auto;
  }
  #nbModalImg {
    max-width: 100%;
    height: auto;
    max-height: min(78vh, 800px);
    object-fit: contain;
    border-radius: 8px;
    margin: 0 auto;
  }
  .nb-modal-cap {
    font-size: 14px;
    color: var(--text2);
    text-align: center;
    line-height: 1.45;
  }
  .nb-modal-blurb { color: var(--text3); font-size: 13px; }
  .nb-footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text3);
    text-align: center;
  }
  .nb-footer a { color: var(--gold); }
</style>
</head>
<body class="nb-page has-app-nav">
<div class="nb-shell">
  <nav class="nb-nav" aria-label="Site" style="display:none" aria-hidden="true"></nav>

  <header class="app-header">
    <div class="app-header__brand">
      <span class="app-header__mark">G</span>
      <div class="app-header__info">
        <div class="app-header__title">Visual Guides</div>
        <div class="app-header__count" style="color:var(--text3);font-size:11px">NotebookLM infographics &amp; exports</div>
      </div>
    </div>
    <div class="app-header__actions">
      <button type="button" class="app-header__btn" data-kitchen-mode-toggle onclick="toggleKitchenMode()" title="Kitchen Mode — larger text">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <span class="app-header__btn-label">Kitchen</span>
      </button>
    </div>
  </header>

  <p class="nb-status" id="nbStatus" aria-live="polite">Loading manifest…</p>
  <div class="nb-filters" id="nbFilterChips"></div>

  <div id="nbEmpty" class="nb-empty" hidden>
    <p><strong>No images yet.</strong></p>
    <p>Export from NotebookLM → save under <code>notebooklm/exports/</code> → add an entry to <code>notebooklm/manifest.json</code>.</p>
    <p><a href="notebooklm/README.md">Full instructions (README)</a></p>
  </div>

  <div class="nb-grid" id="nbGrid" role="list"></div>

  <footer class="nb-footer">Visual guides · Kuschi Kitchen</footer>
</div>

<div class="modal-overlay" id="nbModal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Full size infographic">
  <div class="modal">
    <button type="button" class="modal-close" id="nbModalClose" aria-label="Close">✕</button>
    <img id="nbModalImg" alt="" />
    <p class="nb-modal-cap" id="nbModalCap"></p>
  </div>
</div>

<script src="assets/notebooklm-gallery.js"></script>
<script src="assets/kuschi-kitchen-mode.js"></script>
<script src="assets/app-nav.js"></script>
</body>
</html>
