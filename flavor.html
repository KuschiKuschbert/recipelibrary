<style>
  :root { --app-header-h: 65px; }
  .hero { text-align: center; padding: 48px 24px 24px; position: relative; display: none; }
  .hero-label { font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
  .hero-title { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(32px, 5vw, 48px); font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .hero-sub { font-size: 15px; color: var(--text2); max-width: 560px; margin: 0 auto; line-height: 1.55; }
  .flavor-page { max-width: 1100px; margin: 0 auto; padding: 0 24px 80px; }
  .flavor-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; align-items: center; }
  .flavor-tabs button,
  .flavor-pantry-link {
    padding: 10px 16px; border-radius: 100px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text2); font: inherit; font-size: 13px; cursor: pointer; min-height: 44px;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .flavor-tabs button[aria-selected="true"] { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
  .flavor-pantry-link { margin-left: auto; border-radius: 12px; color: var(--gold-light); }
  .flavor-pantry-link:hover { border-color: var(--gold); background: var(--gold-dim); }
  .flavor-search-wrap { margin-bottom: 20px; }
  .flavor-search-wrap input {
    width: 100%; max-width: 520px; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text); font: inherit; font-size: 15px;
  }
  .flavor-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 24px; align-items: start; }
  @media (max-width: 860px) { .flavor-layout { grid-template-columns: 1fr; } }
  .flavor-results { display: flex; flex-direction: column; gap: 6px; max-height: min(60vh, 520px); overflow-y: auto; }
  .flavor-result-row {
    text-align: left; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font: inherit; cursor: pointer; display: flex; justify-content: space-between; gap: 12px;
  }
  .flavor-result-row:hover { border-color: var(--gold); }
  .flavor-result-name { font-weight: 600; }
  .flavor-result-hint { font-size: 12px; color: var(--text3); }
  #flavorDetail {
    border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; background: var(--surface);
    min-height: 200px; position: sticky; top: 16px;
  }
  .flavor-detail-title { font-family: 'Playfair Display', serif; font-size: 26px; margin: 0 0 12px; color: var(--text); }
  .flavor-meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .flavor-badge { font-size: 12px; padding: 4px 10px; border-radius: 100px; background: var(--bg2); color: var(--text2); border: 1px solid var(--border); }
  .flavor-avoid { background: rgba(180, 60, 60, 0.12); border: 1px solid rgba(180, 60, 60, 0.35); padding: 10px 12px; border-radius: var(--radius-sm); margin: 12px 0; font-size: 14px; }
  .flavor-subst { font-size: 14px; color: var(--text2); margin: 10px 0; }
  .flavor-section { margin-top: 18px; }
  .flavor-section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold); margin: 0 0 8px; }
  .flavor-section h4 { font-size: 12px; color: var(--text3); margin: 10px 0 6px; }
  .flavor-pair-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .flavor-pair-chip { font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); }
  .flavor-tier-hg { border-color: var(--gold); color: var(--gold-light); }

  .flavor-badge-toolkit { border-color: rgba(0, 188, 212, 0.45); color: #7fd8e8; }

  .flavor-fk-harmony { border-color: rgba(255, 255, 255, 0.35); color: var(--text); }

<body class="has-app-nav">
<header class="app-header">
  <div class="app-header__brand">
    <span class="app-header__mark">F</span>
    <div class="app-header__info">
      <div class="app-header__title">Flavor Explorer</div>
      <div class="app-header__count" style="color:var(--text3);font-size:11px">Bible · Thesaurus · Toolkit</div>
    </div>
  </div>
  <div class="app-header__actions">
    <button type="button" class="app-header__btn" data-kitchen-mode-toggle onclick="toggleKitchenMode()" title="Kitchen Mode — larger text">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <span class="app-header__btn-label">Kitchen</span>
    </button>
  </div>
</header>

<div class="flavor-page">
  <div class="flavor-tabs" role="tablist">
    <button type="button" role="tab" data-flavor-tab="explore" aria-selected="true">Explore</button>
    <button type="button" role="tab" data-flavor-tab="wheel" aria-selected="false">Thesaurus wheel</button>
    <button type="button" role="tab" data-flavor-tab="science" aria-selected="false">Science snippets</button>
    <button type="button" role="tab" data-flavor-tab="toolkit" aria-selected="false">Kitchen toolkit</button>
    <a href="pantry.html" class="flavor-pantry-link">Pantry → recipes</a>
  </div>

  <section class="flavor-tab-panel" data-panel="explore">
    <div class="flavor-search-wrap">
      <input type="search" id="flavorSearch" placeholder="Ingredient (e.g. tomatoes, cumin, lamb)…" autocomplete="off" />
      <div id="flavorLoadStatus"></div>
    </div>
    <div class="flavor-layout">
      <div id="flavorResults" class="flavor-results"></div>
      <div id="flavorDetail"><p class="flavor-empty">Select an ingredient for pairings, avoids, and aroma links.</p></div>
    </div>
  </section>

  <section class="flavor-tab-panel" data-panel="wheel" hidden>
    <p class="flavor-empty" style="margin-bottom:16px">99 Flavor Thesaurus ingredients by family. Tap to jump back to Explore.</p>
    <div id="flavorWheelHost"></div>
  </section>

  <section class="flavor-tab-panel" data-panel="science" hidden>
    <div id="flavorScienceHost"></div>
  </section>

  <section class="flavor-tab-panel" data-panel="toolkit" hidden>
    <div id="flavorToolkitHost"><p class="flavor-empty">Open this tab to load the toolkit…</p></div>
  </section>

  <div class="footer">Flavor explorer · Kuschi Kitchen</div>
</div>
