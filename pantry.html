<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0c0c0c">
<title>Pantry → recipes · Kuschi Kitchen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c9a96e'/%3E%3C/svg%3E" />
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="stylesheet" href="assets/theme.css?v=161">
<link rel="preload" href="pantry_data/shard_hay_index.json" as="fetch" type="application/json" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --app-header-h: 65px; }
  body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
  body.has-app-nav { padding-bottom: var(--nav-safe-bottom, 60px); }
  .pantry-wrap { max-width: 760px; margin: 0 auto; padding: 22px 20px 32px; }
  .pantry-panel {
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.02)), var(--surface);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.045);
  }
  .pantry-lead { color: var(--text3); font-size: 14px; line-height: 1.55; margin-bottom: 14px; }
  textarea {
    width: 100%; min-height: 106px; padding: 15px 16px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text); font: inherit; font-size: 15px; resize: vertical;
    box-sizing: border-box; transition: border-color 0.2s;
  }
  textarea:focus { outline: none; border-color: var(--gold); }
  .pantry-action-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
  }
  button.primary {
    padding: 13px 24px; min-height: 48px; border-radius: 12px;
    border: 1px solid rgba(201,169,110,0.4); background: var(--gold-dim); color: var(--gold);
    font-weight: 600; cursor: pointer; font: inherit; font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.2s, border-color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  button.primary:hover { background: rgba(201,169,110,0.22); border-color: var(--gold); }
  button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
  #out { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 12px; }
  .pantry-card {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 16px;
    background: var(--surface); cursor: pointer; min-height: 126px;
    display: flex; flex-direction: column; gap: 10px;
    transition: border-color 0.2s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .pantry-card:hover  { border-color: var(--border-hover); background: var(--surface-hover); }
  .pantry-card:active { background: rgba(201,169,110,0.07); }
  .pantry-card:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .pantry-name { font-weight: 600; font-size: 17px; line-height: 1.25; font-family: 'Playfair Display', serif; color: var(--text); }
  .pantry-meta { font-size: 12px; color: var(--text3); line-height: 1.5; }
  .pantry-match-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 25px;
  }
  .pantry-match-chip {
    display: inline-flex;
    align-items: center;
    min-height: 25px;
    padding: 3px 8px;
    border: 1px solid rgba(201,169,110,0.22);
    border-radius: 999px;
    background: rgba(201,169,110,0.09);
    color: var(--gold-light);
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
  }
  .pantry-open-hint {
    margin-top: auto;
    min-height: 32px;
    display: flex;
    align-items: center;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.08);
    color: var(--gold-light);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .pantry-status { flex: 1 1 260px; font-size: 13px; color: var(--text3); margin: 0; line-height: 1.5; }
  .pantry-status.is-searching { color: var(--gold-light); font-weight: 600; }
  @media (max-width: 680px) {
    .pantry-panel { padding: 14px; }
    button.primary { width: 100%; }
  }
  @media (min-width: 720px) {
    html.lenovo-tab-one-profile #out {
      gap: 10px;
    }
    html.lenovo-tab-one-profile .pantry-card {
      min-height: 132px;
      padding: 14px;
      gap: 8px;
    }
    html.lenovo-tab-one-profile .pantry-match-chip {
      min-height: 23px;
      padding: 3px 7px;
      font-size: 12px;
    }
    html.lenovo-tab-one-profile .pantry-open-hint {
      font-size: 12px;
    }
    html.lenovo-tab-one-profile.low-memory-device textarea,
    html.lenovo-tab-one-profile.low-memory-device button.primary,
    html.lenovo-tab-one-profile.low-memory-device .pantry-card {
      transition-duration: 0.08s;
    }
  }
  @media (min-width: 900px) and (orientation: landscape), (min-width: 1100px) {
    .pantry-wrap {
      max-width: 1040px;
      padding: 22px 24px 40px;
    }
    #out {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  @media (min-width: 901px) and (max-height: 900px) and (orientation: landscape) {
    html.lenovo-tab-one-profile .pantry-wrap {
      max-width: 1216px;
      padding: 12px 16px 28px;
    }
    html.lenovo-tab-one-profile .pantry-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 280px);
      gap: 10px 14px;
      padding: 13px;
      align-items: end;
    }
    html.lenovo-tab-one-profile .pantry-lead {
      grid-column: 1 / -1;
      margin-bottom: 0;
      font-size: 13px;
      line-height: 1.35;
    }
    html.lenovo-tab-one-profile textarea {
      min-height: 72px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 16px;
      line-height: 1.35;
    }
    html.lenovo-tab-one-profile .pantry-action-row {
      align-content: stretch;
      align-self: stretch;
      flex-direction: column;
      gap: 8px;
      margin-top: 0;
    }
    html.lenovo-tab-one-profile button.primary {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 10px;
    }
    html.lenovo-tab-one-profile .pantry-status {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      font-size: 12px;
      line-height: 1.35;
    }
    html.lenovo-tab-one-profile #out {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    html.lenovo-tab-one-profile .pantry-card {
      min-height: 132px;
      padding: 12px;
      gap: 7px;
      border-radius: 10px;
    }
    html.lenovo-tab-one-profile .pantry-card:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
    }
    html.lenovo-tab-one-profile.low-memory-device .pantry-card:hover {
      background: var(--surface);
      border-color: var(--border);
    }
    html.lenovo-tab-one-profile .pantry-name {
      display: -webkit-box;
      overflow: hidden;
      min-height: 2.3em;
      font-size: 15.5px;
      line-height: 1.15;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    html.lenovo-tab-one-profile .pantry-meta {
      font-size: 12px;
      line-height: 1.35;
    }
    html.lenovo-tab-one-profile .pantry-match-chips {
      max-height: 28px;
      overflow: hidden;
      gap: 4px;
    }
    html.lenovo-tab-one-profile .pantry-match-chip {
      min-height: 24px;
      padding: 2px 7px;
      font-size: 12px;
      line-height: 1.1;
    }
    html.lenovo-tab-one-profile .pantry-open-hint {
      display: none;
    }
  }
</style>
</head>
<body class="has-app-nav">

<header class="app-header">
  <div class="app-header__brand">
    <span class="app-header__mark">P</span>
    <div class="app-header__info">
      <div class="app-header__title">Pantry Search</div>
      <div class="app-header__count" style="color:var(--text3)">Ingredients you have → recipes</div>
    </div>
  </div>
  <div class="app-header__actions">
    <button type="button" class="app-header__btn" data-kitchen-mode-toggle onclick="toggleKitchenMode()" title="Kitchen Mode — larger text">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <span class="app-header__btn-label">Kitchen</span>
    </button>
  </div>
</header>

<div class="pantry-wrap">
  <section class="pantry-panel" aria-label="Pantry recipe search">
    <p class="pantry-lead">Enter ingredients you have (comma or newline separated). Matched against the library ingredient index.</p>
    <textarea id="pantryIn" placeholder="e.g. chicken, lemon, garlic, olive oil" aria-label="Ingredients you have"></textarea>
    <div class="pantry-action-row">
      <button type="button" class="primary" id="pantryGo" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Find recipes
      </button>
      <p class="pantry-status" id="pantryStatus">Loading pantry index…</p>
    </div>
  </section>
  <div id="out"></div>
</div>
<script src="assets/kuschi-recipe-ui.js?v=4"></script>
<script>
(function () {
  var SHARDS = [];
  var HAY_INDEX_URL = 'pantry_data/shard_hay_index.json';

  function siteBaseUrl() {
    var origin = window.location.origin;
    var p = window.location.pathname;
    if (/\.html?$/i.test(p)) {
      var dir = p.slice(0, p.lastIndexOf('/'));
      return dir ? origin + dir : origin;
    }
    var stripped = p.replace(/\/$/, '') || '';
    return stripped ? origin + stripped : origin;
  }

  function norm(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function tokens(s) {
    return norm(s).split(' ').filter(function (w) { return w.length > 2; });
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  var hayIndex = null;
  var hayIndexFailed = false;
  var shardRecipeCache = Object.create(null);

  function loadCatalogManifest() {
    if (SHARDS.length) return Promise.resolve(SHARDS);
    var base = siteBaseUrl();
    return fetch(base + '/alpha_catalog/manifest.json')
      .then(function (r) {
        if (!r.ok) throw new Error('manifest');
        return r.json();
      })
      .then(function (data) {
        SHARDS = (data && data.files) || [];
        return SHARDS;
      });
  }

  function loadHayIndex() {
    if (hayIndexFailed) return Promise.resolve(null);
    if (hayIndex) return Promise.resolve(hayIndex);
    var url = siteBaseUrl() + '/' + HAY_INDEX_URL.replace(/^\/+/, '');
    return fetch(url)
      .then(function (r) {
        if (!r.ok) throw new Error('hay index');
        return r.json();
      })
      .then(function (data) {
        if (data && data.shards && typeof data.shards === 'object') {
          hayIndex = data.shards;
        } else {
          hayIndex = null;
        }
        return hayIndex;
      })
      .catch(function () {
        hayIndexFailed = true;
        hayIndex = null;
        return null;
      });
  }

  /** Shards that might contain any user token (substring), else all shards. */
  function pickShards(needToks) {
    if (!hayIndex || !needToks.length) return SHARDS.slice();
    var picked = [];
    for (var s = 0; s < SHARDS.length; s++) {
      var fn = SHARDS[s];
      var hay = hayIndex[fn];
      if (!hay) continue;
      var hit = false;
      for (var t = 0; t < needToks.length; t++) {
        var tok = needToks[t];
        if (tok && hay.indexOf(tok) >= 0) {
          hit = true;
          break;
        }
      }
      if (hit) picked.push(fn);
    }
    return picked.length ? picked : SHARDS.slice();
  }

  var PANTRY_FETCH_CONCURRENCY = 8;

  /** Same pattern as index.html — bounded parallelism for alpha_catalog fetches. */
  function mapWithConcurrency(items, limit, mapper) {
    var ret = new Array(items.length);
    var next = 0;
    function worker() {
      return new Promise(function (resolve) {
        function step() {
          var i = next++;
          if (i >= items.length) {
            resolve();
            return;
          }
          Promise.resolve(mapper(items[i], i))
            .then(function (v) {
              ret[i] = v;
              step();
            })
            .catch(function () {
              ret[i] = [];
              step();
            });
        }
        step();
      });
    }
    var n = items.length ? Math.min(limit, items.length) : 0;
    if (!n) return Promise.resolve(ret);
    var workers = [];
    for (var w = 0; w < n; w++) workers.push(worker());
    return Promise.all(workers).then(function () { return ret; });
  }

  function fetchShardRecipes(files) {
    var base = siteBaseUrl();
    return mapWithConcurrency(files, PANTRY_FETCH_CONCURRENCY, function (f) {
      if (shardRecipeCache[f]) return Promise.resolve(shardRecipeCache[f]);
      return fetch(base + '/alpha_catalog/' + encodeURIComponent(f))
        .then(function (r) {
          return r.ok ? r.json() : { recipes: [] };
        })
        .then(function (p) {
          var rec = (p && p.recipes) || [];
          shardRecipeCache[f] = rec;
          return rec;
        });
    }).then(function (parts) {
      var all = [];
      for (var i = 0; i < parts.length; i++) {
        all = all.concat(parts[i]);
      }
      return all;
    });
  }

  function loadRecipesForPantrySearch(needToks) {
    return loadHayIndex().then(function () {
      var files = pickShards(needToks);
      return fetchShardRecipes(files).then(function (all) {
        return { all: all, shardCount: files.length };
      });
    });
  }

  function matchedTokensForRecipe(r, needToks) {
    var ing = (r.ing || []).join(' ').toLowerCase();
    var name = (r.name || '').toLowerCase();
    var hay = ing + ' ' + name;
    var matched = [];
    for (var i = 0; i < needToks.length; i++) {
      if (hay.indexOf(needToks[i]) >= 0) matched.push(needToks[i]);
    }
    return matched;
  }

  var pantrySearchScheduler = KuschiRecipeUi.createFilterScheduler({
    run: runPantrySearch,
    delay: 0,
    onPending: function (ctx) {
      var st = document.getElementById('pantryStatus');
      if (!st) return false;
      st.classList.toggle('is-searching', ctx.pending);
      if (ctx.pending) st.textContent = 'Searching library…';
      return false;
    }
  });

  function clearPantrySearch() {
    var input = document.getElementById('pantryIn');
    var out = document.getElementById('out');
    var st = document.getElementById('pantryStatus');
    if (input) input.value = '';
    if (out) out.innerHTML = '';
    if (st) st.textContent = 'Ready - add ingredients and tap Find recipes.';
    if (input) input.focus();
  }
  window.clearPantrySearch = clearPantrySearch;

  function runPantrySearch() {
    var raw = document.getElementById('pantryIn').value;
    var parts = raw.split(/[\n,]+/).map(function (s) { return s.trim(); }).filter(Boolean);
    var needToks = [];
    parts.forEach(function (p) {
      tokens(p).forEach(function (t) {
        if (needToks.indexOf(t) < 0) needToks.push(t);
      });
    });
    var st = document.getElementById('pantryStatus');
    var out = document.getElementById('out');
    out.innerHTML = '';
    if (!needToks.length) {
      pantrySearchScheduler.setPending(false);
      st.textContent = 'Add at least one ingredient.';
      return;
    }
    loadRecipesForPantrySearch(needToks)
      .then(function (pack) {
        pantrySearchScheduler.setPending(false);
        var all = pack.all;
        var scored = [];
        for (var i = 0; i < all.length; i++) {
          var matches = matchedTokensForRecipe(all[i], needToks);
          var sc = matches.length;
          if (sc > 0) scored.push({ r: all[i], sc: sc, matches: matches });
        }
        scored.sort(function (a, b) { return b.sc - a.sc || (a.r.name || '').localeCompare(b.r.name || ''); });
        var displayLimit = 40;
        var visible = scored.slice(0, displayLimit);
        var seg = pack.shardCount < SHARDS.length ? ' · scanned ' + pack.shardCount + '/' + SHARDS.length + ' index parts' : '';
        var shown = scored.length > visible.length ? ' · showing top ' + visible.length : '';
        st.textContent = scored.length + ' matches' + shown + ' · ' + needToks.length + ' tokens · ' + needToks.join(', ') + seg;
        out.innerHTML = visible.map(function (x) {
          var chips = x.matches.slice(0, 5).map(function (tok) {
            return '<span class="pantry-match-chip">' + esc(tok) + '</span>';
          }).join('');
          return '<div class="pantry-card" role="button" tabindex="0" data-open-id="' + esc(x.r.id) + '">' +
            '<div class="pantry-name">' + esc(x.r.name || '') + '</div>' +
            '<div class="pantry-meta">Matched ' + x.sc + '/' + needToks.length + ' · ' + esc(x.r.cui || 'Kitchen library') + '</div>' +
            '<div class="pantry-match-chips">' + chips + '</div>' +
            '<div class="pantry-open-hint">Tap anywhere to open</div></div>';
        }).join('');
        out.querySelectorAll('.pantry-card').forEach(function (el) {
          function openCard() {
            var id = el.getAttribute('data-open-id');
            if (id) location.href = 'index.html?open=' + encodeURIComponent(id);
          }
          el.addEventListener('click', openCard);
          el.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' || ev.key === ' ') {
              ev.preventDefault();
              openCard();
            }
          });
        });
        if (!scored.length) {
          out.innerHTML =
            '<div class="empty empty-search-state">' +
            '<div class="empty-kicker">No match</div>' +
            '<h2 class="empty-title">No pantry matches</h2>' +
            '<p class="empty-body">Try broader ingredient names like onion instead of yellow onion.</p>' +
            '<div class="empty-actions"><button type="button" class="empty-action-btn" onclick="clearPantrySearch()">Clear ingredients</button></div>' +
            '</div>';
        }
      })
      .catch(function () {
        pantrySearchScheduler.setPending(false);
        st.textContent = 'Failed to load index.';
      });
  }

  document.getElementById('pantryGo').addEventListener('click', function () {
    pantrySearchScheduler.schedule();
  });

  Promise.all([loadCatalogManifest(), loadHayIndex()])
    .then(function () {
      var go = document.getElementById('pantryGo');
      var st = document.getElementById('pantryStatus');
      if (go) go.disabled = false;
      if (st && st.textContent.indexOf('Loading pantry index') === 0) {
        if (!SHARDS.length) {
          st.textContent = 'Could not load alpha_catalog/manifest.json.';
        } else {
          st.textContent = hayIndex
            ? 'Ready — add ingredients and tap Find recipes. (Only matching index parts load per search.)'
            : 'Ready — add ingredients and tap Find recipes. (Full index load per search — routing file missing.)';
        }
      }
    })
    .catch(function () {
      var st = document.getElementById('pantryStatus');
      var go = document.getElementById('pantryGo');
      if (st) st.textContent = 'Failed to load catalog manifest.';
      if (go) go.disabled = true;
    });
})();
</script>
<script src="assets/kuschi-kitchen-mode.js"></script>
<script src="assets/app-nav.js?v=2"></script>
</body>
</html>
